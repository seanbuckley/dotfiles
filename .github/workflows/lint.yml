# Quality gates (docs/testing.md#quality-gates).
# legacy/ is a frozen snapshot: excluded from lint, included in gitleaks and private words.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # weekly, for external links
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  SHFMT_VERSION: 3.14.1
  EC_VERSION: 3.4.0
  LYCHEE_VERSION: 0.20.1
  CHEZMOI_VERSION: 2.73.0 # keep in step with home/.chezmoiversion

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shfmt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x "$RUNNER_TEMP/shfmt"
      - name: shellcheck and shfmt
        run: |
          mapfile -t files < <(git ls-files -- '*.sh' '*.bash' ':!:legacy/**')
          if [ "${#files[@]}" -eq 0 ]; then echo "No shell scripts yet."; exit 0; fi
          shellcheck "${files[@]}"
          "$RUNNER_TEMP/shfmt" -d -i 2 -ci "${files[@]}"
      - name: Editor selection (home/dot_config/shell/env.sh)
        run: |
          # Fake editors on a minimal PATH; `command -v` is a shell builtin.
          bin="$RUNNER_TEMP/fake"
          mkdir -p "$bin/micro" "$bin/nano"
          printf '#!/bin/sh\n' > "$bin/micro/micro"
          printf '#!/bin/sh\n' > "$bin/nano/nano"
          chmod +x "$bin/micro/micro" "$bin/nano/nano"
          check() { # PATH, preset EDITOR (may be empty), expected "EDITOR VISUAL"
            got=$(env -i PATH="$1" ${2:+EDITOR="$2"} /bin/sh -c '. home/dot_config/shell/env.sh; echo "$EDITOR $VISUAL"')
            if [ "$got" != "$3" ]; then
              echo "::error::PATH=$1 EDITOR=$2: got '$got', want '$3'"
              exit 1
            fi
          }
          check "$bin/micro:$bin/nano" "" "micro micro"
          check "$bin/nano" "" "nano nano"
          check "$bin/none" "" "vi vi"
          check "$bin/micro" "nvim" "nvim nvim"

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.ps1' '*.psm1' '*.psd1' ':!:legacy/**')
          if ($files.Count -eq 0) { "No PowerShell scripts yet."; exit 0 }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning, Error }
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan files and history
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

  private-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tracked files against the private word list
        env:
          AUDIT_WORDS: ${{ secrets.AUDIT_WORDS }}
        run: |
          if [ -z "$AUDIT_WORDS" ]; then
            echo "::error::AUDIT_WORDS secret is not set (docs/security.md#private-words)."
            exit 1
          fi
          list="$RUNNER_TEMP/words"
          # Drop blank lines and CRs: an empty pattern would match every file.
          printf '%s\n' "$AUDIT_WORDS" | tr -d '\r' | grep -v '^[[:space:]]*$' > "$list"
          # File names only, so the log never shows a word. grep exits 1 for "no match";
          # anything above 1 is a real error and must not pass as clean.
          set +e
          hits=$(git ls-files -z | xargs -0 grep -I -l -i -w -F -f "$list" --)
          status=$?
          set -e
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::Private words found in the files above. Fix them; never print the list."
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 123 ]; then
            echo "::error::grep failed (xargs exit $status)."
            exit 1
          fi
          echo "No private words found."

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse JSON, YAML and TOML
        run: |
          pip install --quiet pyyaml
          git ls-files -z -- '*.json' '*.yml' '*.yaml' '*.toml' ':!:legacy/**' \
            | xargs -0 -r python3 -c '
          import json, sys, tomllib, yaml
          bad = 0
          for f in sys.argv[1:]:
              try:
                  with open(f, "rb") as fh:
                      if f.endswith(".json"):
                          json.load(fh)
                      elif f.endswith(".toml"):
                          tomllib.load(fh)
                      else:
                          list(yaml.safe_load_all(fh))
              except Exception as e:
                  print(f"{f}: {e}")
                  bad = 1
          sys.exit(bad)
          '

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install editorconfig-checker
        run: |
          curl -fsSL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EC_VERSION}/ec-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
      - name: editorconfig-checker
        run: |
          git ls-files -z -- ':!:legacy/**' | xargs -0 "$RUNNER_TEMP/bin/ec-linux-amd64"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lychee
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
      - name: Relative links and anchors
        if: github.event_name != 'schedule'
        run: |
          git ls-files -z -- '*.md' ':!:legacy/**' \
            | xargs -0 "$RUNNER_TEMP/lychee" --offline --include-fragments --no-progress
      - name: External links (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --exclude: the old repos (dotfiles-legacy, dotfiles-windows) stay private, so
          # links to them 404 for this token and for the public. They're pointers for Sean.
          git ls-files -z -- '*.md' ':!:legacy/**' \
            | xargs -0 "$RUNNER_TEMP/lychee" --include-fragments --no-progress \
              --exclude 'github\.com/seanbuckley/dotfiles-(legacy|windows)'

  chezmoi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          case "$RUNNER_OS" in
            Linux) asset="chezmoi_${CHEZMOI_VERSION}_linux_amd64.tar.gz" ;;
            Windows) asset="chezmoi_${CHEZMOI_VERSION}_windows_amd64.zip" ;;
          esac
          base="https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          grep " ${asset}\$" "chezmoi_${CHEZMOI_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p bin
          case "$asset" in
            *.zip) unzip -q -o "$asset" chezmoi.exe -d bin ;;
            *) tar -xzf "$asset" -C bin chezmoi ;;
          esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Init, dry run and data
        run: |
          # Throwaway home, so nothing touches the runner's profile.
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config" # runners set it outside HOME
          mkdir -p "$HOME"
          chezmoi --version
          chezmoi init --promptDefaults --source .
          chezmoi apply --dry-run --verbose --source .
          chezmoi data --source . --format json > "$RUNNER_TEMP/data.json"
          jq '{profile, name, email, codeDir, osID, isWSL, isOmarchy}' "$RUNNER_TEMP/data.json"
          jq -e '.profile == "workstation" and .name == "Sean Buckley"' "$RUNNER_TEMP/data.json"
      - name: Apply, then check the rendered git config
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config" # runners set it outside HOME
          chezmoi apply --source .
          chezmoi verify --source .
          # git reads ~/.gitconfig (and its includes) from the throwaway home.
          git config --global --list > /dev/null
          test "$(git config --global user.email)" = seanbuckley@users.noreply.github.com
          test "$(git config --global alias.main)" = "checkout main"
          if git config --global core.editor; then
            echo "::error::core.editor is set; the editor comes from EDITOR (D10)."
            exit 1
          fi
          # ~/.gitconfig_local must be the last include, so local settings win.
          git config --file "$HOME/.gitconfig" --get-all include.path | tail -n 1 \
            | grep -qx '~/.gitconfig_local'
          # Shell env is Unix-only until Phase 4 brings the PowerShell side.
          if [ "$RUNNER_OS" = Windows ]; then
            test ! -e "$HOME/.config/shell/env.sh"
          else
            test -f "$HOME/.config/shell/env.sh"
          fi
          git aliases | grep '^alias\.whoami ' > /dev/null # not -q: an early exit can SIGPIPE git under pipefail
          # Global ignore: OS/editor junk only, never project files.
          git init -q "$RUNNER_TEMP/ignore-test"
          cd "$RUNNER_TEMP/ignore-test"
          for f in x/.DS_Store .vscode/state.json .claude/settings.local.json x/.claude/settings.local.json; do
            git check-ignore -q "$f" || { echo "::error::$f should be ignored."; exit 1; }
          done
          for f in x/a.png x/.env .vscode/settings.json .vscode/extensions.json .idea/vcs.xml .claude/settings.json; do
            if git check-ignore -q "$f"; then
              echo "::error::The global ignore hides $f; keep it to OS and editor junk."
              exit 1
            fi
          done
      - name: Env overrides win over defaults
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config" # runners set it outside HOME
          DOTFILES_PROFILE=minimal DOTFILES_CODE_DIR=ci-code-dir chezmoi init --promptDefaults --source .
          chezmoi data --source . --format json \
            | jq -e '.profile == "minimal" and .codeDir == "ci-code-dir"'
          if DOTFILES_PROFILE=bogus chezmoi init --promptDefaults --source . 2>/dev/null; then
            echo "::error::An unknown DOTFILES_PROFILE was accepted."
            exit 1
          fi
      - name: Work identity (includeIf per workGitDirs)
        run: |
          export HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config" # runners set it outside HOME
          cfg="$XDG_CONFIG_HOME/chezmoi/chezmoi.toml"
          chezmoi apply --source .
          if grep -q includeIf "$HOME/.gitconfig"; then
            echo "::error::An empty workGitDirs must render no includeIf."
            exit 1
          fi
          # A config made before workGitDirs existed has no key; apply (no re-init)
          # must still work and render no includeIf.
          grep -v '^  workGitDirs = ' "$cfg" > "$cfg.old"
          cp "$cfg" "$cfg.bak" && mv "$cfg.old" "$cfg"
          if grep -q workGitDirs "$cfg"; then exit 1; fi
          chezmoi apply --source .
          if grep -q includeIf "$HOME/.gitconfig"; then
            echo "::error::A missing workGitDirs key must render no includeIf."
            exit 1
          fi
          mv "$cfg.bak" "$cfg"
          # Add a work dir by hand, as on a real machine (TOML literal string, so
          # Windows backslashes need no escaping), then re-init: it must survive.
          # Brackets in the name must match literally, not as a glob class.
          work="$RUNNER_TEMP/work[1]"
          W="$work" awk '/^  workGitDirs = /{print "  workGitDirs = [\047" ENVIRON["W"] "\047]"; next} {print}' \
            "$cfg" > "$cfg.new" && mv "$cfg.new" "$cfg"
          chezmoi init --promptDefaults --source .
          grep -q '^  workGitDirs = \[".' "$cfg"
          chezmoi apply --source .
          git config --global --list > /dev/null
          git config --file "$HOME/.gitconfig_work" user.email work@example.invalid
          git init -q "$work/repo"
          test "$(git -C "$work/repo" config user.email)" = work@example.invalid
          git init -q "$RUNNER_TEMP/work1/repo"
          test "$(git -C "$RUNNER_TEMP/work1/repo" config user.email)" = seanbuckley@users.noreply.github.com
          git init -q "$RUNNER_TEMP/personal"
          test "$(git -C "$RUNNER_TEMP/personal" config user.email)" = seanbuckley@users.noreply.github.com
